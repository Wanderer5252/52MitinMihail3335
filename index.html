<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 90%;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
        }
        .add-form input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        .add-form button {
            padding: 8px;
            width: 20%;
        }
    </style>
</head>
<body>
<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item">
    <button onclick="addItem()">Add</button>
</div>

<script>
    async function addItem() {
        const newItemInput = document.getElementById('newItem');
        const newItemText = newItemInput.value.trim();

        if (newItemText) {
            try {
                const response = await fetch('/api/items', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: newItemText })
                });
                const data = await response.json();
                if (response.ok) {
                    const listBody = document.getElementById('listBody');
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${data.id}</td>
                        <td><input type="text" value="${data.text}" onchange="editItem(${data.id}, this.value)"></td>
                        <td><button class="delete-btn" onclick="deleteItem(${data.id})">×</button></td>
                    `;
                    listBody.appendChild(row);
                    newItemInput.value = '';
                } else {
                    alert('Error adding item');
                }
            } catch (err) {
                console.error('Error:', err);
                alert('Error adding item');
            }
        }
    }

    async function deleteItem(id) {
        try {
            const response = await fetch(`/api/items/${id}`, {
                method: 'DELETE'
            });
            if (response.ok) {
                const row = document.querySelector(`button[onclick="deleteItem(${id})"]`).closest('tr');
                if (row) row.remove();
            } else {
                alert('Error deleting item');
            }
        } catch (err) {
            console.error('Error:', err);
            alert('Error deleting item');
        }
    }

    async function editItem(id, text) {
        try {
            const response = await fetch(`/api/items/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            if (response.ok) {
                const input = document.querySelector(`input[onchange="editItem(${id}, this.value)"]`);
                if (input) input.value = text;
            } else {
                alert('Error updating item');
            }
        } catch (err) {
            console.error('Error:', err);
            alert('Error updating item');
        }
    }
</script>
</body>
</html>
